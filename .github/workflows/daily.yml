name: TCR Daily Schedule Dispatcher

on:
  workflow_dispatch: # This allows Google Apps Script to trigger it remotely

jobs:
  run-whatsapp-bot:
    runs-on: ubuntu-latest
# ... [Keep the rest of your file exactly the same from here down] ...

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Execute WhatsApp Dispatcher
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        run: node index.js

      - name: Save Updated WhatsApp Auth State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add auth_info/
          git commit -m "Auto-refresh WhatsApp Auth State" || echo "No changes to commit"
          git push
