name: TCR Daily Schedule Dispatcher

on:
  # Allows external API triggers from Google Apps Script
  repository_dispatch:
    types: [trigger-schedule-dispatch]

  # Allows manual triggers from GitHub Actions UI
  workflow_dispatch:

jobs:
  trigger-daemon-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dispatch Endpoint on Always-On Bot Server
        env:
          BOT_SERVER_URL: ${{ secrets.BOT_SERVER_URL }}
        run: |
          if [ -z "$BOT_SERVER_URL" ]; then
            echo "❌ BOT_SERVER_URL secret not set. Cannot trigger dispatch."
            exit 1
          fi
          
          echo "🚀 Sending dispatch trigger to $BOT_SERVER_URL/dispatch..."
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$BOT_SERVER_URL/dispatch")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response Status: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Dispatch trigger sent successfully!"
            exit 0
          else
            echo "❌ Dispatch trigger failed with HTTP $HTTP_CODE"
            echo "Check Render logs at: https://dashboard.render.com/d/srv-YOUR-SERVICE-ID/logs"
            exit 1
          fi

